version: "3.9"
services:
    gameservice:
        build: ./game
        ports:
            - "9070:9080"
        environment:
            - io.openliberty.spacerover.ip=192.168.0.115
        depends_on:
            - mockboard
    mockboard:
        build: ./mock/board
        ports:
            - "5046:5045"
    client:
        build:
            context: ./client
            args:
                - GAME_URL=http://localhost:9070/game
                - GAME_SOCKET_URL=ws://localhost:9070/roversocket
        ports:
            - "3000:80"
    bob-bridge:
        build: ./bob-bridge
        ports:
            - "127.0.0.1:4000:4000"
        volumes:
            # Bind-mount the host agent Unix socket so the container can reach it.
            # bob-host-agent.sh must be running on the host before using Generate.
            - /tmp/bob-host-agent.sock:/tmp/bob-host-agent.sock
        environment:
            - BOB_BRIDGE_PORT=4000
            - HOST_AGENT_SOCKET=/tmp/bob-host-agent.sock
        restart: unless-stopped
