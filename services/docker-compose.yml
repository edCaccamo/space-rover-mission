version: "3.9"
services:
    gameservice:
        build: ./game
        ports:
            - "9070:9080"
        environment:
            - io.openliberty.spacerover.ip=192.168.0.115
        depends_on:
            - mockboard
    mockboard:
        build: ./mock/board
        ports:
            - "5046:5045"
    client:
        build:
            context: ./client
            args:
                - GAME_URL=http://localhost:9070/game
                - GAME_SOCKET_URL=ws://localhost:9070/roversocket
        ports:
            - "3000:80"
    bob-bridge:
        build: ./bob-bridge
        ports:
            - "127.0.0.1:4000:4000"
        volumes:
            # Mount the repo root so Bob Shell can read .bob/rules/, specs/,
            # and write generated script JSON files directly into specs/scripts/.
            - ..:/workspace
        environment:
            - BOB_BRIDGE_PORT=4000
            - BOB_WORKSPACE=/workspace
            # Bob Shell API key for non-interactive (headless) authentication.
            # Add BOB_API_KEY=your_key_here to a .env file next to docker-compose.yml.
            # Generate your key at https://bob.ibm.com (API Keys section).
            - BOB_API_KEY=${BOB_API_KEY}
        restart: unless-stopped
