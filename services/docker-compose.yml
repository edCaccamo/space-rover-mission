version: "3.9"
services:
    mongo:
        image: mongo:latest
        environment:
            - MONGO_INITDB_ROOT_USERNAME=root
            - MONGO_INITDB_ROOT_PASSWORD=openliberty
        ports:
            - "27017:27017"
        volumes:
            - ~/mongo/data:/data/db
            - "./leaderboard/assets/:/docker-entrypoint-initdb.d/"
        command: mongod
    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
        depends_on:
            - gameservice
        ports:
            - "9090:9090"
    grafana:
        image: grafana/grafana:7.3.7
        user: "1000"
        container_name: grafana
        volumes:
            - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
            - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
            - ./grafana/dashboards/open-liberty_rev5.json:/var/lib/grafana/dashboards/open-liberty_rev5.json
            - ./grafana/dashboards/space-rover-rev1.json:/var/lib/grafana/dashboards/space-rover-rev1.json
        depends_on:
            - prometheus
        ports:
            - "3010:3000"
    leaderboard:
        build: ./leaderboard
        ports:
            - "9190:9080"
    gameservice:
        build: ./game
        ports:
            - "9070:9080"
    client:
        build:
            context: ./client
            args:
                - GAME_URL=http://localhost:9070/game
                - GAME_SOCKET_URL=ws://localhost:9070/roversocket
                - GAME_DURATION_SECONDS=120
                - LEADERBOARD_URL=http://localhost:9190/mongo/leaderboard
        ports:
            - "3000:80"
    bob-bridge:
        build: ./bob-bridge
        ports:
            - "127.0.0.1:4000:4000"
        volumes:
            # Mount the full repo root read-only so Bob loads .bob/rules/ and the rover-spec skill
            - ../:/workspace:ro
            # Overlay specs/scripts/ read-write — the only writable path
            - ../specs/scripts:/workspace/specs/scripts:rw
        env_file:
            - .env
        environment:
            - BOB_BRIDGE_PORT=4000
            - SCRIPTS_DIR=/workspace/specs/scripts
            - BOBSHELL_API_KEY=${BOB_API_KEY}
        restart: unless-stopped
